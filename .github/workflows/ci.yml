name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Syntax Check
      run: npm run test:syntax

    - name: Validate MCP Tools Handshake
      run: npm run test:mcp

    - name: Validate JSON Schema Configs
      run: |
        node -e "JSON.parse(require('fs').readFileSync('.agents/opencode-models.json', 'utf8'))"
        node -e "JSON.parse(require('fs').readFileSync('.agents/mcp_config.json', 'utf8'))"

    - name: Install OpenCode CLI for Unit Tests
      run: npm install -g opencode-ai@latest

    - name: Run Test Suite
      run: npm test
